trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: 'New variable group 20-Sep'

stages:

- stage: Build
  displayName: 'Build Stage'

  jobs:
  - job: Build
    displayName: 'Build and Verify Container'

    steps:
    - checkout: self

    # 1. This tests your Dockerfile to make sure your HTML/CSS files package correctly
    - script: |
        echo "Building your container image from Dockerfile..."
        docker build -t local-web-app:latest .
        echo "Container build passed successfully!"
      displayName: 'Docker Build Check'


- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy to AKS Cluster'

    steps:
    - checkout: self

    # 2. This task connects to your 'devops' cluster and rolls out the app
    - task: AzureCLI@2
      displayName: 'Fetch Subscription and Connect to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)' 
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group devops --name devops
          kubectl apply -f app.yaml
