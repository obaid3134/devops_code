trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    echo "Hello, Azure!"
    echo "I am running inside the pipeline agent."

    echo "Current directory:"
    pwd

    echo "Files:"
    ls -la

    echo "Git version:"
    git --version

    echo "Python version:"
    python3 --version

  displayName: 'Explore the pipeline agent'
