trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: 'New variable group 20-Sep'

stages:

- stage: Build
  displayName: 'Build Stage'

  jobs:
  - job: Build
    displayName: 'Build Static Website'

    steps:
    - checkout: self

    - script: |
        echo "Starting build..."
        echo "Checking website files..."
        ls -la
      displayName: 'Build Static Website'

- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy to AKS Cluster'

    steps:
    - checkout: self

    # This task automatically grabs your subscription and connects to your cluster
    - task: AzureCLI@2
      displayName: 'Fetch Subscription and Connect to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)' # This maps to the variable we create in the UI
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Automatically hooks up your pipeline context to your active 'devops' cluster
          az aks get-credentials --resource-group devops --name devops
          
          # Deploys your web application files right into the cluster
          kubectl apply -f app.yaml
