trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: 'New variable group 20-Sep'

stages:

- stage: Build
  displayName: 'Build Stage'

  jobs:
  - job: Build
    displayName: 'Build Static Website'

    steps:
    - checkout: self

    - script: |
        echo "Starting build..."
        echo "Checking website files..."
        ls -la
      displayName: 'Build Static Website'

- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy to AKS Cluster'

    steps:
    - checkout: self

    # 1. Log into your Azure Subscription automatically inside the pipeline
    - task: AzureCLI@2
      displayName: 'Connect to AKS Cluster'
      inputs:
        azureSubscription: 'Azure subscription 1' # Matches your subscription name
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Links the pipeline agent directly to your active 'devops' cluster
          az aks get-credentials --resource-group devops --name devops
          
          # Deploys your web application manifests to your running cluster
          kubectl apply -f app.yaml
